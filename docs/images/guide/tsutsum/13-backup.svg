acSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="400">最終バックアップ: 2026/08/01 21:30</text><rect x="101.0" y="176.5" width="248.0" height="40.0" fill="#A9663F" rx="8.0"/><path d="M162.56,194.73 L160.44,194.73 L160.44,202.52 L171.06,202.52 L171.06,194.73 L168.94,194.73" fill="none" stroke="#ffffff" stroke-width="1.3458333333333334" stroke-linecap="round" stroke-linejoin="round"/><line x1="165.8" y1="190.5" x2="165.8" y2="198.6" stroke="#ffffff" stroke-width="1.3458333333333334" stroke-linecap="round"/><path d="M162.92,193.31 L165.75,190.48 L168.58,193.31" fill="none" stroke="#ffffff" stroke-width="1.3458333333333334" stroke-linecap="round" stroke-linejoin="round"/><text x="180.2" y="201.0" font-size="12.5" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="600">ファイルに書き出す</text><text x="101.0" y="235.1" font-size="10.5" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="400">書き出したファイルは iCloud Drive など、ご自身</text><text x="101.0" y="250.6" font-size="10.5" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="400">のクラウドに保存してください。</text><text x="89.0" y="290.5" font-size="11.0" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="600">復元</text><rect x="89.0" y="309.5" width="272.0" height="120.5" fill="#ffffff" rx="10.0" stroke="#c3cad4" stroke-width="1.2"/><rect x="101.0" y="321.5" width="248.0" height="40.0" fill="#ffffff" rx="8.0" stroke="#A9663F" stroke-width="1.4"/><path d="M162.59,345.91 L161.66,346.43 L160.64,346.76 L159.58,346.88 L158.51,346.79 L157.48,346.49 L156.54,345.99 L155.71,345.32 L155.03,344.49 L154.52,343.55 L154.22,342.53 L154.12,341.46 L154.23,340.40 L154.55,339.38 L155.07,338.44 L155.76,337.63 L156.60,336.96 L157.55,336.48 L158.58,336.20 L159.65,336.12 L160.71,336.25 L161.72,336.60 L162.65,337.13 L163.45,337.84 L164.09,338.70 L164.56,339.66" fill="none" stroke="#A9663F" stroke-width="1.3458333333333334" stroke-linecap="round" stroke-linejoin="round"/><path d="M161.53,343.36 L162.59,345.91 L165.00,344.92" fill="none" stroke="#A9663F" stroke-width="1.3458333333333334" stroke-linecap="round" stroke-linejoin="round"/><text x="174.0" y="346.0" font-size="12.5" fill="#A9663F" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="600">ファイルから復元する</text><text x="101.0" y="380.1" font-size="10.5" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="400">書き出しておいたバックアップファイル（.zip）を</text><text x="101.0" y="395.6" font-size="10.5" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="400">選ぶと、この端末のデータをその時点の内容に戻し</text><text x="101.0" y="411.1" font-size="10.5" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="400">ます。現在の記録はすべて置き換わります。</text><text x="89.0" y="451.0" font-size="11.0" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="600">自動バックアップ</text><rect x="89.0" y="470.0" width="272.0" height="55.0" fill="#ffffff" rx="10.0" stroke="#c3cad4" stroke-width="1.2"/><text x="101.0" y="490.6" font-size="10.5" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="400">iPhone は端末の iCloud バックアップに記録が含</text><text x="101.0" y="506.1" font-size="10.5" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="400">まれます。</text><text x="89.0" y="545.6" font-size="10.5" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="400">データは、この端末とあなたのクラウド以外には出ませ</text><text x="89.0" y="561.1" font-size="10.5" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="400">ん。</text></g><line x1="85.0" y1="668.0" x2="365.0" y2="668.0" stroke="#c3cad4" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="3 4"/></g><path d="M349.0,196.5 H390.0 V196.5 H392.0" fill="none" stroke="#2b7a6f" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="349.0" cy="196.5" r="2.0" fill="#2b7a6f"/><rect x="392.5" y="187.0" width="19.0" height="19.0" fill="#2b7a6f" rx="5.0"/><text x="402.0" y="200.3" font-size="11" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">2</text><path d="M349.0,341.5 H390.0 V341.5 H392.0" fill="none" stroke="#2b7a6f" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="349.0" cy="341.5" r="2.0" fill="#2b7a6f"/><rect x="392.5" y="332.0" width="19.0" height="19.0" fill="#2b7a6f" rx="5.0"/><text x="402.0" y="345.3" font-size="11" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">4</text><path d="M101.0,158.8 H60.0 V158.8 H58.0" fill="none" stroke="#d1483b" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="101.0" cy="158.8" r="2.0" fill="#d1483b"/><circle cx="48.0" cy="158.8" r="9.5" fill="#d1483b"/><text x="48.0" y="162.6" font-size="11" fill="#ffffff" font-family="-apple-sys